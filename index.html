<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đối Tượng BMT & Quét CCCD</title>
    
    <!-- Icon iOS -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3126/3126500.png">
    
    <!-- Thư viện ZXing (Quét mã QR) & SheetJS (Xuất Excel) -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f6f9; text-align: center; }
        h2 { color: #1a3d5d; margin-bottom: 15px; }
        
        /* Frame Camera */
        #video-container { position: relative; max-width: 400px; margin: 0 auto; }
        #video { width: 100%; height: auto; border: 3px solid #1a3d5d; border-radius: 8px; background: #000; }
        
        /* Trạng thái & Thông báo */
        #result-box { margin: 15px auto; max-width: 500px; font-size: 15px; font-weight: bold; padding: 12px; border-radius: 6px; color: #495057; background: #e9ecef; }
        .success { color: white !important; background: #28a745 !important; }
        
        /* Nút bấm */
        .btn-container { margin-top: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button { padding: 10px 18px; font-size: 14px; font-weight: bold; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .btn-excel { background-color: #28a745; }
        .btn-excel:hover { background-color: #218838; }
        .btn-clear { background-color: #dc3545; }
        .btn-clear:hover { background-color: #bd2130; }
        
        /* Bảng danh sách */
        .table-container { margin-top: 20px; overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); padding: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; text-align: left; }
        th, td { padding: 10px 12px; border: 1px solid #dee2e6; font-size: 14px; }
        th { background-color: #1a3d5d; color: white; text-align: center; }
        tr:nth-child(even) { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <h2>QUẢN LÝ ĐỐI TƯỢNG BMT - QUÉT CCCD</h2>
    
    <!-- Vùng Camera -->
    <div id="video-container">
        <video id="video"></video>
    </div>
    
    <!-- Trạng thái quét -->
    <div id="result-box">Hệ thống đang khởi động camera...</div>

    <!-- Các nút chức năng -->
    <div class="btn-container">
        <button class="btn-excel" onclick="xuatExcel()">Xuất File Excel</button>
        <button class="btn-clear" onclick="xoaDanhSach()">Xóa Danh Sách</button>
    </div>

    <!-- Bảng xem trước dữ liệu đã quét -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ và tên</th>
                    <th>Số CCCD</th>
                    <th>Ngày sinh</th>
                    <th>Giới tính</th>
                    <th>Nơi thường trú</th>
                </tr>
            </thead>
            <tbody id="data-table-body">
                <tr><td colspan="6" style="text-align:center;">Chưa có dữ liệu quét</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // Khôi phục dữ liệu từ LocalStorage
        let danhSachCCCD = JSON.parse(localStorage.getItem("QuanLyDoiTuongBMT")) || [];
        let bieuDoTrungLap = new Set(danhSachCCCD.map(item => item["số CCCD"]));
        
        let dangXuLyQuet = false; 
        const codeReader = new ZXing.BrowserQRCodeReader();
        const videoElement = document.getElementById('video');
        const resultBox = document.getElementById('result-box');

        // Cập nhật giao diện ban đầu khi tải trang
        capNhatGiaoDien();

        // Chuyển chuỗi YYYYMMDD hoặc DDMMYYYY thành DD/MM/YYYY
        function dinhDangNgayThang(chuoiNgay) {
            if (!chuoiNgay) return "";
            let thuanChuoi = chuoiNgay.trim();
            if (thuanChuoi.length === 8 && !isNaN(thuanChuoi)) {
                return thuanChuoi.substring(0, 2) + "/" + thuanChuoi.substring(2, 4) + "/" + thuanChuoi.substring(4, 8);
            }
            return thuanChuoi;
        }

        // Luồng quét mã QR
        function startScanning() {
            codeReader.decodeFromVideoDevice(undefined, 'video', (result, err) => {
                if (dangXuLyQuet) return;

                if (result) {
                    const decodedText = result.text;
                    const thongTin = decodedText.split('|');
                    const soCCCDXacThuc = thongTin[0] || decodedText; 

                    // Chống quét trùng
                    if (bieuDoTrungLap.has(soCCCDXacThuc)) return; 

                    dangXuLyQuet = true; 
                    const sttHienTai = danhSachCCCD.length + 1;
                    let objectCCCD = {};

                    if (thongTin.length >= 5) {
                        objectCCCD = {
                            "thứ tự": sttHienTai,
                            "họ và tên": thongTin[2] || "",
                            "ngày sinh": dinhDangNgayThang(thongTin[3]),
                            "giới tính": thongTin[4] || "",
                            "số CMND cũ": thongTin[1] || "",
                            "số CCCD": thongTin[0] || "",
                            "ngày cấp": dinhDangNgayThang(thongTin[6]),
                            "nơi thường trú": thongTin[5] || "",
                            "dữ liệu gốc": decodedText,
                            "nơi ở hiện nay": thongTin[5] || "",
                            "ghi chú": ""
                        };
                    } else {
                        objectCCCD = {
                            "thứ tự": sttHienTai,
                            "họ và tên": "Mã QR Không Chuẩn CCCD",
                            "ngày sinh": "",
                            "giới tính": "",
                            "số CMND cũ": "",
                            "số CCCD": soCCCDXacThuc,
                            "ngày cấp": "",
                            "nơi thường trú": "",
                            "dữ liệu gốc": decodedText,
                            "nơi ở hiện nay": "",
                            "ghi chú": ""
                        };
                    }

                    // Lưu dữ liệu
                    bieuDoTrungLap.add(soCCCDXacThuc);
                    danhSachCCCD.push(objectCCCD);
                    localStorage.setItem("QuanLyDoiTuongBMT", JSON.stringify(danhSachCCCD));
                    
                    capNhatGiaoDien();

                    // Phản hồi visual & Rung nhẹ trên điện thoại
                    resultBox.innerText = "ĐÃ LƯU: " + objectCCCD["họ và tên"] + " (Tổng: " + danhSachCCCD.length + " đối tượng)";
                    resultBox.className = "success";
                    if (navigator.vibrate) navigator.vibrate(200);

                    // Mở lại luồng quét sau 1.5 giây
                    setTimeout(() => {
                        dangXuLyQuet = false;
                        resultBox.innerText = "Sẵn sàng quét đối tượng tiếp theo... (Tổng: " + danhSachCCCD.length + ")";
                        resultBox.className = "";
                    }, 1500);
                }
            });
        }

        // Cập nhật bảng hiển thị trên web
        function capNhatGiaoDien() {
            const tbody = document.getElementById('data-table-body');
            if (danhSachCCCD.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Chưa có dữ liệu quét</td></tr>';
                resultBox.innerText = "Camera Sẵn Sàng: Hãy đưa mã QR CCCD vào!";
                return;
            }

            resultBox.innerText = "Đã khôi phục dữ liệu: Hiện có " + danhSachCCCD.length + " đối tượng.";
            
            tbody.innerHTML = danhSachCCCD.map(item => `
                <tr>
                    <td style="text-align:center;">${item["thứ tự"]}</td>
                    <td><b>${item["họ và tên"]}</b></td>
                    <td>${item["số CCCD"]}</td>
                    <td>${item["ngày sinh"]}</td>
                    <td>${item["giới tính"]}</td>
                    <td>${item["nơi thường trú"]}</td>
                </tr>
            `).join('');
        }

        // Khởi tạo Camera
        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "environment", 
                focusMode: "continuous",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            } 
        }).then(stream => {
            videoElement.srcObject = stream;
            videoElement.setAttribute("playsinline", true);
            videoElement.play();
            startScanning();
        }).catch(() => {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                videoElement.srcObject = stream;
                videoElement.setAttribute("playsinline", true);
                videoElement.play();
                startScanning();
            }).catch(() => {
                resultBox.innerText = "Không thể kết nối camera!";
            });
        });

        // Xuất File Excel
        function xuatExcel() {
            if (danhSachCCCD.length === 0) {
                alert("Chưa có dữ liệu đối tượng nào!");
                return;
            }

            const danhSachXuatExcel = danhSachCCCD.map(item => ({
                "thứ tự": item["thứ tự"],
                "họ và tên": item["họ và tên"],
                "ngày sinh": item["ngày sinh"],
                "giới tính": item["giới tính"],
                "số CMND cũ": item["số CMND cũ"],
                "số CCCD": item["số CCCD"],
                "ngày cấp": item["ngày cấp"],
                "nơi thường trú": item["nơi thường trú"],
                "dữ liệu gốc": item["dữ liệu gốc"],
                "nơi ở hiện nay": item["nơi ở hiện nay"],
                "ghi chú": item["ghi chú"]
            }));

            const worksheet = XLSX.utils.json_to_sheet(danhSachXuatExcel);
            const range = XLSX.utils.decode_range(worksheet['!ref']);
            
            // Định dạng cột Ngày sinh (C) và Ngày cấp (G) dưới dạng Text thuần túy để tránh lỗi đinh dạng Excel
            for (let R = range.s.r + 1; R <= range.e.r; ++R) {
                ['C', 'G'].forEach(col => {
                    let cell_ref = col + (R + 1);
                    if(worksheet[cell_ref]) worksheet[cell_ref].z = '@';
                });
            }

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "QuanLyDoiTuongBMT");
            XLSX.writeFile(workbook, "Danh_Sach_Doi_Tuong_BMT.xlsx");
        }

        // Xóa danh sách
        function xoaDanhSach() {
            if (confirm("Xác nhận XÓA SẠCH toàn bộ danh sách đối tượng hiện tại?")) {
                danhSachCCCD = [];
                bieuDoTrungLap.clear();
                localStorage.removeItem("QuanLyDoiTuongBMT");
                capNhatGiaoDien();
                alert("Đã xóa xong!");
            }
        }
    </script>
</body>
</html>
